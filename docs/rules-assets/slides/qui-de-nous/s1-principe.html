<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><script src="../../lib/boot.js"></script><style>
/* 5 s : la question s'affiche, le doigt tourne entre les joueurs et s'arrête sur Tom */
.stage>*{position:absolute}
.q{top:150px;font-size:40px;font-weight:900;text-align:center;line-height:1.2}
.q small{display:block;font-size:26px;font-weight:700;opacity:.75;margin-top:8px}
.p{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:28px;font-weight:800}
.p .av{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:66px;
  background:rgba(20,20,36,.92);border:4px solid rgba(255,255,255,.15)}
.p1{transform:translate(-300px,140px)} .p2{transform:translate(0,230px)} .p3{transform:translate(300px,140px)}
.p2 .av{animation:hit 5s infinite}
@keyframes hit{0%,52%{border-color:rgba(255,255,255,.15);transform:none;box-shadow:none}
  56%{transform:scale(1.15)}60%,94%{border-color:var(--main);transform:scale(1.08);box-shadow:0 0 50px var(--main)}100%{transform:none}}
.ptr{font-size:110px;top:340px;transform-origin:50% 50%;animation:spin 5s infinite cubic-bezier(.2,.7,.3,1)}
@keyframes spin{0%{transform:rotate(-200deg)}50%,94%{transform:rotate(90deg)}100%{transform:rotate(-200deg)}}
.eyes{font-size:60px;transform:translate(90px,170px);opacity:0;animation:eyes 5s infinite}
@keyframes eyes{0%,58%{opacity:0;transform:translate(90px,190px) scale(.5)}64%,94%{opacity:1;transform:translate(90px,150px)}100%{opacity:0}}
</style></head><body data-duration="5"><div class="stage">
<div class="q">Qui de nous… 👀<small>est le plus susceptible de rater son avion ?</small></div>
<div class="p p1"><div class="av">⭐</div>Léa</div>
<div class="p p2"><div class="av">🦊</div>Tom</div>
<div class="p p3"><div class="av">🐼</div>Sam</div>
<div class="ptr">👉</div>
<div class="eyes">😏</div>
</div></body></html>
