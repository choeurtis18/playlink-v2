<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><script src="../../lib/boot.js"></script><style>
/* Animation 4 s en boucle : la carte se retourne, on la lit, swipe → carte suivante */
.stage>*{position:absolute}
.deck{width:260px;height:360px}
.deck .card{position:absolute;inset:0}
.d1{transform:translate(14px,14px) rotate(4deg)} .d2{transform:translate(7px,7px) rotate(2deg)}
.top{position:absolute;inset:0;perspective:1400px;animation:swipe 4s infinite ease-in}
.flip{position:absolute;inset:0;transform-style:preserve-3d;animation:flip 4s infinite ease-in-out}
.flip .card{position:absolute;inset:0;backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.hand{font-size:110px;z-index:3;animation:hand 4s infinite ease-in-out;opacity:0}
@keyframes flip{0%,8%{transform:rotateY(0)}25%,100%{transform:rotateY(180deg)}}
@keyframes swipe{0%,62%{transform:none;opacity:1}82%{transform:translateX(-620px) rotate(-22deg);opacity:1}83%,92%{opacity:0;transform:none}100%{opacity:1;transform:none}}
@keyframes hand{0%,48%{opacity:0;transform:translate(90px,320px)}56%,62%{opacity:1;transform:translate(70px,230px)}82%{opacity:1;transform:translate(-420px,250px)}90%,100%{opacity:0;transform:translate(-420px,250px)}}
</style></head><body><div class="stage">
<div class="deck">
<div class="card is-back d1"></div><div class="card is-back d2"></div>
<div class="top"><div class="flip">
<div class="card is-back"></div>
<div class="card front"><span class="tag">VÉRITÉ</span><span class="txt">Quel est ton plus gros mensonge cette semaine ?</span></div>
</div></div>
</div>
<div class="hand">👆</div>
</div></body></html>
