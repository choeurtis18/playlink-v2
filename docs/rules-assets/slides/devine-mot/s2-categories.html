<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><script src="../../lib/boot.js"></script><style>
.col{display:flex;flex-direction:column;gap:22px;align-items:center}
.pills{display:flex;flex-direction:column;gap:18px;width:600px} .pill{width:100%}
.opts{display:flex;gap:40px;margin-top:16px;align-items:flex-start}
.opt{display:flex;flex-direction:column;align-items:center;gap:14px}
.opt .label{font-size:20px}
.dots{display:flex;gap:10px;height:56px;align-items:center} .dots i{width:26px;height:26px;border-radius:50%;background:#fff}
.dots i.off{background:none;border:3px solid rgba(255,255,255,.5)}
.chips{display:flex;gap:10px} .chips span{width:62px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;background:rgba(20,20,36,.92);border:2px solid rgba(255,255,255,.1)}
.chips span.on{background:linear-gradient(135deg,var(--main),var(--secondary));border-color:transparent}
</style></head><body><div class="stage"><div class="col">
<div class="pills">
<div class="pill"><span class="em">📦</span>Objets et Lieux</div>
<div class="pill"><span class="em">🎬</span>Personnages et Culture</div>
<div class="pill"><span class="em">💭</span>Abstrait et Expressions</div>
</div>
<div class="opts">
<div class="opt"><div class="label">Intensité</div><div class="dots"><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div></div>
<div class="opt"><div class="label">Cartes</div><div class="chips"><span>5</span><span class="on">10</span><span>15</span><span>20</span></div></div>
</div>
</div></div></body></html>
