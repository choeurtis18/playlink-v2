<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><script src="../../lib/boot.js"></script><style>
/* 5 s : deux options, le doigt hésite… puis choisit */
.stage>*{position:absolute}
.top{top:170px;font-size:40px;font-weight:900}
.opt{width:300px;height:300px;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  font-size:34px;font-weight:900;text-align:center;background:rgba(20,20,36,.92);border:4px solid rgba(255,255,255,.15);box-shadow:0 24px 50px rgba(0,0,0,.45)}
.opt span{font-size:110px;line-height:1}
.l{transform:translateX(-210px)} .r{transform:translateX(210px)}
.l{animation:pick 5s infinite}
@keyframes pick{0%,58%{border-color:rgba(255,255,255,.15);background:rgba(20,20,36,.92);transform:translateX(-210px)}
  61%{transform:translateX(-210px) scale(.94)}64%,94%{border-color:#22C55E;background:#16A34A;transform:translateX(-210px)}100%{transform:translateX(-210px)}}
.badge{z-index:2}
.hand{font-size:100px;z-index:3;top:560px;animation:hes 5s infinite}
@keyframes hes{0%{transform:translate(0,80px);opacity:0}10%{opacity:1;transform:none}20%{transform:translateX(200px)}32%{transform:translateX(-200px)}44%{transform:translateX(160px)}56%,60%{transform:translate(-210px,-60px)}70%,94%{transform:translate(-210px,-20px);opacity:1}100%{opacity:0}}
</style></head><body data-duration="5"><div class="stage">
<div class="top">Tu préfères…</div>
<div class="opt l"><span>🕊️</span>Pouvoir<br>voler</div>
<div class="opt r"><span>👻</span>Être<br>invisible</div>
<div class="badge">OU</div>
<div class="hand">👆</div>
</div></body></html>
