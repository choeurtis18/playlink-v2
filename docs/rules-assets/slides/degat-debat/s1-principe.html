<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><script src="../../lib/boot.js"></script><style>
/* 5 s : POUR et CONTRE foncent l'un sur l'autre → éclair au choc */
.stage>*{position:absolute}
.b{font-size:56px;font-weight:900;letter-spacing:3px;padding:44px 50px;border-radius:60px;box-shadow:0 30px 60px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px}
.pour{background:#fff;color:var(--secondary);border-bottom-left-radius:14px;animation:pour 5s infinite}
.contre{background:linear-gradient(135deg,var(--main),var(--secondary));color:#fff;border-bottom-right-radius:14px;animation:contre 5s infinite}
@keyframes pour{0%{transform:translateX(-700px)}22%{transform:translateX(-275px)}26%{transform:translateX(-300px)}30%,92%{transform:translateX(-290px)}100%{transform:translateX(-700px)}}
@keyframes contre{0%{transform:translateX(700px)}22%{transform:translateX(275px)}26%{transform:translateX(300px)}30%,92%{transform:translateX(290px)}100%{transform:translateX(700px)}}
.bolt{font-size:170px;z-index:2;opacity:0;animation:bolt 5s infinite}
@keyframes bolt{0%,21%{opacity:0;transform:scale(.2) rotate(-20deg)}26%{opacity:1;transform:scale(1.3) rotate(8deg)}32%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
.flash{inset:0;background:#fff;opacity:0;animation:flash 5s infinite}
@keyframes flash{0%,22%{opacity:0}23%{opacity:.5}30%,100%{opacity:0}}
.sub{top:640px;font-size:34px;font-weight:800;opacity:0;animation:sub 5s infinite}
@keyframes sub{0%,34%{opacity:0;transform:translateY(20px)}40%,90%{opacity:1;transform:none}95%,100%{opacity:0}}
</style></head><body data-duration="5"><div class="stage">
<div class="flash"></div>
<div class="b pour">👍 POUR</div><div class="b contre">CONTRE 👎</div>
<div class="bolt">⚡</div>
<div class="sub">Choisis ton camp. Défends-le.</div>
</div></body></html>
